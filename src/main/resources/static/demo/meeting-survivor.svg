<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Calendar Survivor</title>
  <desc id="desc">A tiny office worker faces a towering pile of meeting invitations.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#33152b"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
  <rect width="900" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="755" cy="100" r="54" fill="#ff0055" opacity=".2"/>
  <g fill="#20283a" stroke="#ff6b9a" stroke-width="3">
    <rect x="510" y="92" width="238" height="94" rx="12" transform="rotate(-7 510 92)"/>
    <rect x="560" y="196" width="240" height="94" rx="12" transform="rotate(6 560 196)"/>
    <rect x="484" y="302" width="270" height="100" rx="12" transform="rotate(-3 484 302)"/>
  </g>
  <g fill="#f0f2f5" font-family="system-ui,sans-serif" font-weight="700">
    <text x="548" y="143" font-size="24">QUICK SYNC</text><text x="591" y="246" font-size="23">ALIGNMENT</text>
    <text x="528" y="361" font-size="23">FOLLOW-UP SYNC</text>
  </g>
  <path d="M218 347h153l40 106H176z" fill="#ff0055"/><circle cx="296" cy="248" r="66" fill="#f1c5a7"/>
  <path d="M231 240q60-104 128 0" fill="#25202c"/><path d="M263 266h14m44 0h14" stroke="#17151a" stroke-width="8" stroke-linecap="round"/>
  <path d="M275 300q21-17 42 0" fill="none" stroke="#9e344c" stroke-width="5"/>
  <text x="58" y="91" fill="#fff" font-family="system-ui,sans-serif" font-size="34" font-weight="800">CALENDAR SURVIVOR</text>
  <text x="58" y="465" fill="#ffd2df" font-family="system-ui,sans-serif" font-size="24">Declined invite. Regained 30 seconds.</text>
</svg>
