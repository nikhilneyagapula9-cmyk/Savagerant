  <title id="title">Coffee Has Boundaries</title>
  <desc id="desc">A coffee mug sits beside a machine that needs cleaning.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#33261e"/><stop offset="1" stop-color="#141a22"/></linearGradient></defs>
  <rect width="900" height="520" rx="28" fill="url(#bg)"/><circle cx="705" cy="135" r="90" fill="#f4a261" opacity=".1"/>
  <rect x="188" y="193" width="215" height="193" rx="24" fill="#394355" stroke="#f4a261" stroke-width="5"/>
  <rect x="224" y="229" width="143" height="52" rx="9" fill="#171b25"/><text x="239" y="263" fill="#ffc078" font-family="system-ui,sans-serif" font-size="19">CLEAN ME</text>
  <rect x="262" y="301" width="67" height="44" rx="7" fill="#171b25"/><path d="M245 386v21m99-21v21" stroke="#f4a261" stroke-width="6"/>
