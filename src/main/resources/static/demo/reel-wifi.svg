<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Wi-Fi: Gone for Ten Seconds, Remembered Forever</title>
  <desc id="desc">An original illustrated router flashes a single light as a person waits.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102c42"/><stop offset="1" stop-color="#29172f"/></linearGradient></defs>
  <rect width="1280" height="720" fill="url(#bg)"/><circle cx="920" cy="345" r="240" fill="#00d3c7" opacity=".08"/>
  <path d="M785 260q145-155 290 0M824 310q107-108 214 0M866 360q65-65 130 0" fill="none" stroke="#68f0e5" stroke-width="21" stroke-linecap="round" opacity=".86"/>
  <rect x="850" y="426" width="200" height="160" rx="26" fill="#202a3c" stroke="#68f0e5" stroke-width="7"/>
  <circle cx="914" cy="535" r="14" fill="#ff0055"><animate attributeName="opacity" values="1;.18;1" dur="1s" repeatCount="indefinite"/></circle>
  <circle cx="980" cy="535" r="14" fill="#ffd166"/>
  <path d="M260 485h280l48 158H212z" fill="#5c6fff"/><circle cx="400" cy="320" r="96" fill="#e8b995"/>
  <path d="M305 310q28-140 192-54" fill="#271f2e"/><path d="M355 345h18m55 0h18" stroke="#14141a" stroke-width="11" stroke-linecap="round"/>
  <path d="M372 400q28 23 57 0" fill="none" stroke="#833b4a" stroke-width="8"/>
  <text x="72" y="105" fill="#fff" font-family="system-ui,sans-serif" font-size="44" font-weight="800">WI-FI: GONE FOR TEN SECONDS</text>
  <text x="72" y="674" fill="#c7fff8" font-family="system-ui,sans-serif" font-size="32">The household has called an emergency summit.</text>
</svg>
