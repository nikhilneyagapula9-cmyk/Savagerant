<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Buffering in Public</title>
  <desc id="desc">A router blinks dramatically while a person waits for the internet to return.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12243b"/><stop offset="1" stop-color="#25152d"/></linearGradient></defs>
  <rect width="900" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="680" cy="270" r="164" fill="#00d3c7" opacity=".08"/>
  <path d="M570 176q110-115 220 0M601 212q79-81 158 0M637 247q43-43 86 0" fill="none" stroke="#68f0e5" stroke-width="13" stroke-linecap="round" opacity=".8"/>
  <rect x="624" y="302" width="126" height="103" rx="16" fill="#202a3c" stroke="#68f0e5" stroke-width="4"/>
  <circle cx="665" cy="372" r="8" fill="#ff0055"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></circle>
  <circle cx="705" cy="372" r="8" fill="#ffd166"/>
  <path d="M188 355h184l32 98H156z" fill="#5c6fff"/><circle cx="280" cy="254" r="62" fill="#e8b995"/>
  <path d="M218 247q18-91 128-34" fill="#271f2e"/><path d="M251 270h13m37 0h13" stroke="#14141a" stroke-width="7" stroke-linecap="round"/>
  <path d="M262 303q18 15 37 0" fill="none" stroke="#833b4a" stroke-width="5"/>
  <text x="56" y="88" fill="#fff" font-family="system-ui,sans-serif" font-size="34" font-weight="800">BUFFERING IN PUBLIC</text>
  <text x="56" y="475" fill="#c7fff8" font-family="system-ui,sans-serif" font-size="24">Ten seconds offline. Entire household: “Are we okay?”</text>
</svg>
