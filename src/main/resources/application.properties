# Server Port
server.port=8081
server.address=${SAVAGESCREEN_SERVER_ADDRESS:127.0.0.1}

# H2 Database Configuration (override SAVAGESCREEN_DB_URL for deployment)
spring.datasource.url=${SAVAGESCREEN_DB_URL:jdbc:h2:file:./data/savagescreen_db;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console
spring.h2.console.enabled=${SAVAGESCREEN_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Set to the normalized email of the account permitted to review reports.
savagescreen.moderator-email=${SAVAGESCREEN_MODERATOR_EMAIL:}
savagescreen.social-graph-url=${SAVAGESCREEN_SOCIAL_GRAPH_URL:http://127.0.0.1:8082}
savagescreen.video-service-url=${SAVAGESCREEN_VIDEO_SERVICE_URL:http://127.0.0.1:8083}
savagescreen.ai.chat-completions-url=${SAVAGESCREEN_AI_CHAT_COMPLETIONS_URL:}
savagescreen.ai.model=${SAVAGESCREEN_AI_MODEL:}
savagescreen.ai.api-key=${SAVAGESCREEN_AI_API_KEY:}
savagescreen.demo-content.enabled=${SAVAGESCREEN_DEMO_CONTENT_ENABLED:true}
server.tomcat.max-http-form-post-size=51MB
server.tomcat.max-swallow-size=51MB